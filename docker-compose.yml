services:
  cretewerkz-app:
    image: nginx:alpine
    container_name: cretewerkz-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"  # For SSL if you add it later
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cretewerkz-network

networks:
  cretewerkz-network:
    driver: bridge


