version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arcos-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      # Using external PostgreSQL server at 192.168.2.124
      DATABASE_URL: postgresql://arcos_user:${DB_PASSWORD:-arcos_secure_password_change_me}@192.168.2.124:5432/arcos_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-in-production}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80,http://localhost}
    ports:
      - "3001:3001"
    volumes:
      # Mount source for development (optional)
      # - ./backend/src:/app/src
      - ./backend/logs:/app/logs
    restart: unless-stopped
    networks:
      - arcos-network
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        sleep 5 &&
        npx tsx src/db/migrate.ts &&
        npx tsx src/db/seed.ts || echo 'Seed skipped (may already exist)' &&
        node dist/index.js
      "

  # Frontend Web App (Nginx)
  frontend:
    image: nginx:alpine
    container_name: arcos-frontend
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - arcos-network

networks:
  arcos-network:
    driver: bridge