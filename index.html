<!doctype html>
<html lang="en" data-theme="concrete">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1A1A1A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Arcos - Concrete. Reimagined.</title>
    
    <!-- Preload fonts to prevent FOUT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&subset=latin,latin-ext&display=swap" rel="stylesheet" />
    
    <!-- Inline critical theme script to prevent flash -->
    <script>
      (function() {
        const theme = localStorage.getItem('arcos.theme') || 'concrete';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    
    <!-- Critical CSS to prevent layout shift -->
    <style>
      /* Prevent flash of unstyled content */
      html, body { 
        background-color: #1A1A1A; 
        color: #f5f5f5;
        min-height: 100%;
      }
      /* Hide content until styles load, but keep layout */
      #root:empty::before {
        content: '';
        display: block;
        min-height: 100vh;
        background-color: #1A1A1A;
      }
    </style>
  </head>
  <body class="bg-[#1A1A1A] text-white antialiased">
    <!-- React mounts here -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
