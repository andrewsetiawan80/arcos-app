<!doctype html>
<html lang="en" data-theme="concrete">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#232323" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Arcos - Concrete. Reimagined.</title>
    
    <!-- Preload fonts to prevent FOUT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Arcos brand typography: Headlines = geometric sans, Body = Helvetica Neue / system -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    
    <!-- Inline critical theme script to prevent flash -->
    <script>
      (function() {
        const theme = localStorage.getItem('arcos.theme') || 'concrete';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    
    <!-- Critical CSS to prevent layout shift -->
    <style>
      /* Arcos brand: #232323 black, #FFFFFF white - prevent flash of unstyled content */
      html, body { 
        background-color: #232323; 
        color: #ffffff;
        min-height: 100%;
      }
      #root:empty::before {
        content: '';
        display: block;
        min-height: 100vh;
        background-color: #232323;
      }
    </style>
  </head>
  <body class="bg-[#232323] text-white antialiased">
    <!-- React mounts here -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
